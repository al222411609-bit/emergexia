# Levanta todo con:  docker compose up --build
# Web: http://localhost:8080   ·   API: http://localhost:8000/docs
services:
  backend:
    build: ./backend
    environment:
      SPARK_MASTER: local[*]          # cámbialo por spark://tu-master:7077 para usar un clúster
      SPARK_APP_NAME: Emergexia
      DATA_DIR: /data
      JWT_SECRET: cambia-esto-por-una-clave-larga-y-aleatoria
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_NAME: Yessica López
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - emergexia-data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  emergexia-data:
